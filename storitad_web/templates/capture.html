{% extends "base.html" %}
{% set active_tab = "record" %}
{% block title %}Record — Storitad{% endblock %}
{% block appbar %}<span class="appbar-title" id="greeting">Record</span>{% endblock %}
{% block content %}
<div class="segmented" id="mode">
  <button id="mode-voice" class="active">🎙 Voice</button>
  <button id="mode-video">🎬 Video</button>
</div>
<select id="camera" class="camera-select" hidden aria-label="Camera"></select>
<div id="effects" class="effects" hidden aria-label="Background effect">
  <button type="button" class="chip active" data-effect="off">None</button>
  <button type="button" class="chip" data-effect="blur">Blur</button>
  <button type="button" class="chip" data-effect="image" data-image="/static/backgrounds/mushroom.webp">Mushroom</button>
  <button type="button" class="chip" data-effect="image" data-image="/static/backgrounds/meadow.webp">Meadow</button>
  <button type="button" class="chip" data-effect="gradient">Warm</button>
</div>
<p id="fx-notice" class="fx-notice" hidden></p>
<video id="preview" playsinline muted hidden></video>
<canvas id="fx-canvas" class="fx-canvas" hidden></canvas>
<script type="module" src="/static/effects.js?v={{ asset_v }}"></script>
<div class="record-hero">
  <button id="record">● Record</button>
  <button id="stop" hidden>■ Stop</button>
  <span id="timer">0:00</span>
  <button type="button" id="pick-file" class="upload-link">or upload a file</button>
  <input type="file" id="file-input" accept="audio/*,video/*" hidden>
</div>
<audio id="playback" controls hidden></audio>
<form id="meta" class="card" hidden>
  <label>Recipients</label><div class="chips" id="recipients"></div>
  <label>Mood</label><input name="mood" placeholder="happy">
  <div class="chips" id="mood-quick">
    <button type="button" class="chip" data-mood="😊 happy">😊</button>
    <button type="button" class="chip" data-mood="😌 calm">😌</button>
    <button type="button" class="chip" data-mood="😢 sad">😢</button>
    <button type="button" class="chip" data-mood="🤔 thoughtful">🤔</button>
  </div>
  <label>Notes</label><textarea name="notes"></textarea>
  <label><input type="checkbox" id="use-location" style="width:auto"> Attach location</label>
  <details class="more-details">
    <summary>Add details</summary>
    <label>Subject</label><input name="subject">
    <label>Tags</label><input name="tags" placeholder="comma, separated">
    <div class="chips" id="recent-tags"></div>
  </details>
  <button type="submit" class="btn-primary">Save story</button>
  <progress id="upload" hidden max="100"></progress>
</form>
<script src="/static/app.js?v={{ asset_v }}"></script>
{% endblock %}
