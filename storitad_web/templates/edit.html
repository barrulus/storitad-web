{% extends "base.html" %}
{% block title %}Edit — Storitad{% endblock %}
{% block content %}
<h1>Edit entry</h1>
<form id="edit" data-id="{{ entry.fm.id }}">
  <label>Subject <input name="subject" value="{{ entry.fm.subject }}"></label>
  <label>Mood <input name="mood" value="{{ entry.fm.mood or '' }}"></label>
  <label>Tags <input name="tags" value="{{ entry.fm.tags|join(', ') }}"></label>
  <label>Transcript <textarea name="transcript" rows="6">{{ entry.transcript }}</textarea></label>
  <label>Notes <textarea name="notes" rows="4">{{ entry.notes }}</textarea></label>
  <button type="submit">Save</button>
  <button type="button" id="delete">Delete</button>
</form>
<script src="/static/edit.js"></script>
{% endblock %}
